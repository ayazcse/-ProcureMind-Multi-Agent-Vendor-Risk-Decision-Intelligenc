server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container (Docker Compose service name).
    # The frontend calls VITE_API_URL (default "/api"), which Nginx forwards here.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Single-page app fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
